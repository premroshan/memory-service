[project]
name = "memory-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "premroshan", email = "premroshan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
memory-service = "memory_service:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests", "experiments"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
